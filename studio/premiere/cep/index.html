<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>月灯スタジオ</title>
  <style>
    body { margin: 0; background: #1d1d1d; color: #ddd; font: 12px "Yu Gothic UI", sans-serif; display: flex; flex-direction: column; height: 100vh; }
    .bar { display: flex; gap: 6px; align-items: center; padding: 6px; border-bottom: 1px solid #333; flex-wrap: wrap; }
    input, button { background: #2b2b2b; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 4px 8px; font: inherit; }
    button.primary { background: #f0b45a; color: #000; border-color: #f0b45a; }
    #note { flex: 1; min-width: 120px; }
    #log { height: 70px; overflow: auto; padding: 4px 6px; border-bottom: 1px solid #333; color: #aaa; }
    iframe { flex: 1; border: 0; width: 100%; }
  </style>
</head>
<body>
  <div class="bar">
    <input id="server" value="http://localhost:8765" style="width:150px">
    <input id="ep" value="EP09" style="width:50px">
    <label><input type="checkbox" id="auto" checked> AIの操作を受ける</label>
  </div>
  <div class="bar">
    <input id="note" placeholder="AIへのひとこと（例：S1 の溜めを伸ばした。続きを詰めて）">
    <button id="mic">🎤</button>
    <button class="primary" id="handoff">AIに渡す</button>
  </div>
  <div id="log"></div>
  <iframe id="studio"></iframe>
  <script>
    // CEP の evalScript（CSInterface.js なしで使える低レベルの口）
    const evalScript = (code) => new Promise((ok) => window.__adobe_cep__.evalScript(code, ok));
    // Premiere か After Effects か。それぞれ自分宛ての命令だけ取り出す
    const APP = (() => { try { return JSON.parse(window.__adobe_cep__.getHostEnvironment()).appName; } catch (e) { return "PPRO"; } })();
    const HOST = APP === "AEFT" ? "aftereffects" : "premiere";
    const $ = (id) => document.getElementById(id);
    const server = () => $("server").value.replace(/\/$/, "");
    const log = (s) => { $("log").insertAdjacentHTML("afterbegin", `<div>${new Date().toLocaleTimeString()} ${s}</div>`); };
    const load = () => { $("studio").src = `${server()}/#/ep/${$("ep").value}/${HOST === "aftereffects" ? "shots" : "edit"}`; };
    document.title = `月灯スタジオ（${HOST === "aftereffects" ? "After Effects" : "Premiere"}）`;
    $("server").onchange = $("ep").onchange = load;
    load();

    // エージェントの操作を取り出して Premiere で実行する
    async function poll() {
      if (!$("auto").checked) return;
      try {
        const cmds = await (await fetch(`${server()}/api/premiere/commands?host=${HOST}`)).json();
        for (const c of cmds) {
          log(`AI：${c.command}`);
          const raw = await evalScript(`tsukiRun(${JSON.stringify(JSON.stringify({ command: c.command, args: c.args }))})`);
          let res; try { res = JSON.parse(raw); } catch (e) { res = { error: raw }; }
          await fetch(`${server()}/api/premiere/commands/${c.id}/result`, {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ok: !res.error, result: res }) });
          if (c.command === "read" && !res.error) await sendState(res, "AI が読み取り");
          log(res.error ? `失敗：${res.error}` : `完了：${c.command}`);
        }
      } catch (e) { /* サーバーが止まっているときは静かに待つ */ }
    }
    setInterval(poll, 3000);
    // つながったことと、アプリの版をツールに知らせる（動作確認用）
    evalScript("tsukiHello()").then((raw) => {
      let r; try { r = JSON.parse(raw); } catch (e) { r = { error: raw }; }
      log(r.error ? `ExtendScript が読み込めません：${r.error}` : `${r.app} ${r.version} とつながりました`);
      fetch(`${server()}/api/adobe/hello`, { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ host: HOST, ...r }) }).catch(() => log("月灯スタジオのサーバーに届きません。起動しているか確認してください"));
    });

    async function sendState(state, note) {
      state.note = note;
      const r = await (await fetch(`${server()}/api/premiere/state/${$("ep").value}`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(state) })).json();
      log(`送りました：尺の変更 ${r.changes.length} 件`);
    }

    // 監督の手直しをそのまま渡す
    $("handoff").onclick = async () => {
      const state = JSON.parse(await evalScript("tsukiRead()"));
      if (state.error) return log(state.error);
      await sendState(state, $("note").value);   // ひとことは、ツール側で監督のレビューとして残る
      $("note").value = "";
    };

    // 音声入力
    $("mic").onclick = () => {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return log("この環境は音声入力に対応していません");
      const r = new SR(); r.lang = "ja-JP"; r.interimResults = false;
      r.onresult = (e) => { $("note").value += e.results[0][0].transcript; };
      r.start(); log("話してください…");
    };
  </script>
</body>
</html>
